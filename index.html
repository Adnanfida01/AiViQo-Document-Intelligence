    <meta charset="UTF-8" />

    <meta property="og:description" content="Transform PDFs, scans, and business paperwork into structured, verifiable data with multi-engine OCR, calibrated confidence, and real-time evidence tracking." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return originalFetch;
            },
            set: function(fn) {
              originalFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {}

        window.addEventListener('error', function(event) {
          if (
            event &&
            ((event.filename && (event.filename.indexOf('chrome-extension://') !== -1 || event.filename.indexOf('moz-extension://') !== -1)) ||
             (event.message && event.message.indexOf('Cannot set property fetch') !== -1))
          ) {
            event.preventDefault();
            return true;
          }
        });
      })();
    </script>
  </head>
  <body class="bg-[#07090e] text-slate-100 antialiased selection:bg-[#00d2ff]/20 selection:text-[#00d2ff]">

  </body>
